<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Small Wins — Tin Nguyen</title>
    <meta name="description"
        content="Small wins and stories from life beyond research — soccer, badminton, guitar, and more.">
    <link rel="stylesheet" href="stylesheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="images/seal_icon.png">
</head>

<body>
    <div class="page-wrapper">

        <!-- Nav back -->
        <nav class="blog-nav">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        </nav>

        <header class="blog-header">
            <h1 class="blog-page-title">Small Wins ✨</h1>
            <p class="blog-page-subtitle">Stories, moments, and adventures beyond the lab.</p>
        </header>

        <!-- Blog listing — rendered dynamically from blog/posts.json -->
        <div id="blog-list" class="blog-list"></div>

    </div>

    <script src="script.js"></script>
    <script>
        // Format date string to display parts
        function formatDate(isoDate) {
            const d = new Date(isoDate + 'T00:00:00');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return {
                month: months[d.getMonth()],
                day: d.getDate(),
                year: d.getFullYear()
            };
        }

        // Render a single blog card
        function renderBlogCard(post, basePath) {
            return `
                <a href="${basePath}blog/${post.slug}.html" class="blog-card">
                    <div class="blog-card-date">
                        <time datetime="${post.date}">${formatDate(post.date).month} ${formatDate(post.date).day}, ${formatDate(post.date).year}</time>
                    </div>
                    <div class="blog-card-body">
                        <h2 class="blog-card-title">${post.title}</h2>
                        <p class="blog-card-excerpt">${post.excerpt}</p>
                    </div>
                </a>`;
        }

        // Fetch posts and render
        fetch('blog/posts.json')
            .then(res => res.json())
            .then(posts => {
                const container = document.getElementById('blog-list');
                container.innerHTML = posts.map(p => renderBlogCard(p, '')).join('');
            })
            .catch(err => console.error('Failed to load blog posts:', err));
    </script>
</body>

</html>
